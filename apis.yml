name: TrialPay
description: >-
  TrialPay was an alternative-payments and offer-based advertising company founded
  in 2006 and based in Mountain View, California, backed by Battery Ventures among
  others. Its platform let merchants and game developers offer users a product for
  "free" in exchange for completing an advertiser-sponsored action (a purchase, trial,
  or signup), with the advertiser paying the merchant — monetizing users who would
  not otherwise pay. TrialPay shipped web, Android, and iOS SDKs plus offer-wall and
  monetization APIs (e.g. GetBuyCoinsInfo / GetBuyDirectInfo) widely used in social
  and mobile games. Visa acquired TrialPay in April 2015 and folded the technology into
  the Visa Commerce Network; TrialPay no longer operates as a standalone company and
  its public developer surface (help.trialpay.com, trialpay.com) is offline.
